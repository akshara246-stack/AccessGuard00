{% extends "base.html" %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">
            🛡️
        </div>

        <h1>AccessGuard</h1>

        <p class="text-muted">
            Identity & Access Management Simulator
        </p>

        <form method="POST">

            <label>Username</label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter username"
                required
            >

            <label class="mt-3">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                required
            >

            <button class="btn btn-primary w-100 mt-4">
                🔐 Sign In
            </button>

        </form>

    </div>

</div>

{% endblock %}
